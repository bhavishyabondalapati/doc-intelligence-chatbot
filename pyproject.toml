[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.2.0"
description = "Local RAG chatbot over PDFs, with a retrieval evaluation harness"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads an embedding model and runs retrieval on the eval corpus"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning"]
